name: Compila Versione macOS e Windows

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-tauri:
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: 'macos-latest'
            args: '--target universal-apple-darwin'
          - platform: 'windows-latest'
            args: ''

    runs-on: ${{ matrix.platform }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Estrai sorgenti da project.zip
        run: |
          tar -xf project.zip || unzip project.zip

      - name: Installa Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Installa Rust (compilatore nativo)
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.platform == 'macos-latest' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - name: Installa dipendenze del progetto
        run: npm install

      - name: Compila con Tauri
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          MACOSX_DEPLOYMENT_TARGET: '10.13'
        with:
          tagName: v0.1.3
          releaseName: 'Triptych Slideshow v0.1.3 (CSS Engine Fix)'
          releaseBody: 'Versione con Tailwind 3 e PostCSS: rimossi @layer e sintassi non supportate da WebKit High Sierra.'
          releaseDraft: false
          prerelease: false
          args: ${{ matrix.args }}
